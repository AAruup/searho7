name: Student privacy check
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install project dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Production bundle build
        run: npm run build
      - name: Install security test utilities (CI only)
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@5.0.2 firebase-tools@14
      - name: Firestore Emulator privacy tests
        run: npx firebase emulators:exec --project demo-searho7-privacy --only firestore "node --test tests/firestore.rules.test.cjs"
